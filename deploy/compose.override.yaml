version: '3.9'

services:
  #database section

  #catalogdb: postgres
  catalogdb:
    container_name: eshop_catalog_db
    environment:
      - POSTGRES_USER=catalog
      - POSTGRES_PASSWORD=catalog
      - POSTGRES_DB=catalog
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - catalog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  #catalogapi: eShop.Catalog.Api (local build; in-stack CatalogDb)
  catalogapi:
    container_name: eshop_catalog_api
    build:
      context: ..
      dockerfile: src/Services/eShop.Catalog.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDb=Host=catalogdb;Port=5432;Database=catalog;Username=catalog;Password=catalog
      - Serilog__WriteTo__1__Args__endpoint=http://lgtm:4318
      - OTEL_SERVICE_NAME=eShop.Catalog.Api
    ports:
      - "5000:8080"
    depends_on:
      catalogdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  #observability section

  #lgtm: Grafana LGTM (Grafana + Loki + Tempo + Prometheus + OTLP)
  lgtm:
    container_name: eshop-grafana-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
