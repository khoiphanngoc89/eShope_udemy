# Local eShop stack (Docker Desktop). One compose file + one override.
# From repo root:
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait catalogdb
# Catalog store only (Grafana and Catalog.Api not required):
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait catalogdb
# Catalog.Api (starts catalogdb if needed; Grafana not required):
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait catalogapi
# Search sync (registers the product CDC connector after Catalog has created mt_doc_product):
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait kafka connect elasticsearch kibana kafka-ui connect-register
# Grafana LGTM + cluster metrics (exporters optional; Catalog does not wait on them):
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait elasticsearch elasticsearch-exporter kafka kafka-exporter lgtm
# Loki process logs + Ops/Infra health (optional; Catalog/Kafka do not wait):
#   docker compose -f deploy/compose.yaml -f deploy/compose.override.yaml up -d --wait \
#     catalogdb postgres-exporter cadvisor lgtm kafka catalogapi log-collector
# Catalog in-stack: catalogapi:8080  Published host port: 5000 (HTTP only)
#
# Two views of the same store (local-development defaults, not production secrets):
#   Published port: 5432  Database=catalog  Username=catalog  Password=catalog
#   In-stack:       Host=catalogdb;Port=5432;Database=catalog;Username=catalog;Password=catalog
#
# Grafana UI: lgtm:3000  Published port: 3000  (admin / admin)
# OTLP HTTP:  lgtm:4318  Published port: 4318
# OTLP gRPC:  lgtm:4317  Published port: 4317
#
# Explore → select Loki (name Loki, type loki, uid loki). Do not add a data source.
# LogQL (last 15 minutes): {service_name=~".*eShop.Catalog.Api.*"}
# Severity: detected_level (info|warn|debug|error). Request rows include trace_id.
#
# Store states: Stopped (pg_isready fails) → Starting (container up, healthcheck not yet succeeding) → Ready (--wait catalogdb returned).
# Catalog states: Starting (waits for store Ready) → Ready (--wait catalogapi returned). Catalog MUST NOT appear available until the store is Ready.
# Ordinary stop: docker compose stop or down without -v. down -v deletes catalog-pgdata and is not the daily stop.
# First start: empty catalog database is valid. Credentials are local-development defaults only.

services:
  #database section
  catalogdb:
    image: postgres:16.15

  #catalog section
  catalogapi:
    image: eshop-catalog-api:local

  #search-sync section
  kafka:
    image: apache/kafka:3.8.1

  connect:
    image: quay.io/debezium/connect:2.7.3.Final

  connect-register:
    image: quay.io/debezium/connect:2.7.3.Final

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2

  #observability section
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0

  lgtm:
    image: grafana/otel-lgtm:0.38.0

  log-collector:
    image: grafana/alloy:v1.21.3

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6

#network section
networks:
  default:
    name: eshop

#volumes section
volumes:
  catalog-pgdata:
    name: catalog-pgdata
