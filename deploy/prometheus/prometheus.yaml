# Copied from grafana/otel-lgtm:0.38.0 docker/prometheus.yaml, then extended
# with job elasticsearch → elasticsearch-exporter:9114. Do not drop the OTLP
# settings — replacing this file with a scrape-only config would hide LGTM self-metrics.
global:
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias

storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: elasticsearch
    metrics_path: /metrics
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]

  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: catalogdb
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: containers
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        regex: (.+)
        target_label: compose_service

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: lgtm-prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
