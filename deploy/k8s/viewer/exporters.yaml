apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              value: postgresql://catalog:catalog@catalogdb.catalog.svc:5432/catalog?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: viewer
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
    spec:
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
          args:
            - --es.uri=http://elasticsearch.search.svc:9200
          ports:
            - containerPort: 9114
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
  namespace: viewer
spec:
  type: ClusterIP
  selector:
    app: elasticsearch-exporter
  ports:
    - name: metrics
      port: 9114
      targetPort: 9114
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka.search.svc 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.11.0
          args:
            - --kafka.server=kafka.search.svc:9092
          ports:
            - containerPort: 9308
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: viewer
spec:
  type: ClusterIP
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadvisor
  namespace: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:v0.60.6
          args:
            - --containerd=/run/k3s/containerd/containerd.sock
            - --containerd-namespace=k8s.io
            - --store_container_labels=true
            - --enable_metrics=cpu,memory
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: k3s-containerd
              mountPath: /run/k3s/containerd
              readOnly: true
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: sys
          hostPath:
            path: /sys
        - name: k3s-containerd
          hostPath:
            path: /run/k3s/containerd
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: viewer
spec:
  type: ClusterIP
  selector:
    app: cadvisor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
