apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.38.0
          volumeMounts:
            - name: prometheus
              mountPath: /otel-lgtm/prometheus.yaml
              subPath: prometheus.yaml
            - name: dashboards
              mountPath: /otel-lgtm/eshop-dashboards
            - name: dashboard-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/eshop-dashboards.yaml
              subPath: eshop-dashboards.yaml
          ports:
            - containerPort: 3000
              name: grafana
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 3100
              name: loki
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: prometheus
          configMap:
            name: lgtm-prometheus
        - name: dashboards
          configMap:
            name: lgtm-grafana-dashboards
        - name: dashboard-provider
          configMap:
            name: lgtm-grafana-dashboard-provider
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: viewer
spec:
  type: NodePort
  selector:
    app: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: loki
      port: 3100
      targetPort: 3100
