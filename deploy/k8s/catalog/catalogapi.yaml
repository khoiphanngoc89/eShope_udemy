apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogapi
  namespace: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogapi
  template:
    metadata:
      labels:
        app: catalogapi
    spec:
      initContainers:
        - name: wait-catalogdb
          image: postgres:16.15
          command:
            - sh
            - -c
            - until pg_isready -h catalogdb -U catalog -d catalog; do sleep 2; done
      containers:
        - name: catalogapi
          image: eshop-catalog-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ConnectionStrings__CatalogDb
              value: Host=catalogdb;Port=5432;Database=catalog;Username=catalog;Password=catalog
            - name: Elasticsearch__Uri
              value: http://elasticsearch.search.svc:9200
            - name: Kafka__BootstrapServers
              value: kafka.search.svc:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm.viewer.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: eShop.Catalog.Api
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalogapi
  namespace: catalog
spec:
  type: ClusterIP
  selector:
    app: catalogapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
